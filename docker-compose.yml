services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: eventflow
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: eventflow
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mock-receiver:
    build: ./mock-receiver
    ports: ["127.0.0.1:8082:8082"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eventflow
      REDIS_HOST: redis
      ALLOWED_WEBHOOK_HOSTS: mock-receiver
      LOCAL_DELIVERY_CONCURRENCY: ${LOCAL_DELIVERY_CONCURRENCY:-1}
      GLOBAL_DELIVERY_CONCURRENCY: ${GLOBAL_DELIVERY_CONCURRENCY:-1}
      ENDPOINT_DELIVERY_CONCURRENCY: ${ENDPOINT_DELIVERY_CONCURRENCY:-1}
      DISTRIBUTED_PERMIT_LEASE: ${DISTRIBUTED_PERMIT_LEASE:-30s}
      DISTRIBUTED_PERMIT_RENEWAL: ${DISTRIBUTED_PERMIT_RENEWAL:-10s}
      CAPACITY_DEFERRAL: ${CAPACITY_DEFERRAL:-20s}
      PENDING_IDLE_SECONDS: ${PENDING_IDLE_SECONDS:-20}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mock-receiver: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on:
      backend: {condition: service_started}
      mock-receiver: {condition: service_started}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      retries: 10
volumes:
  pgdata:
