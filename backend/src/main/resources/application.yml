spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eventflow}
    username: ${DB_USER:eventflow}
    password: ${DB_PASSWORD:eventflow}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
server:
  port: 8080
  tomcat:
    max-http-request-header-size: 8KB
  max-http-request-size: 1MB
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
eventflow:
  allowed-hosts: ${ALLOWED_WEBHOOK_HOSTS:mock-receiver}
  worker-enabled: ${WORKER_ENABLED:true}
  retry-base-seconds: ${RETRY_BASE_SECONDS:5}
  retry-max-seconds: ${RETRY_MAX_SECONDS:300}
  lease-seconds: ${LEASE_SECONDS:15}
  pending-idle-seconds: ${PENDING_IDLE_SECONDS:20}
  local-concurrency: ${LOCAL_DELIVERY_CONCURRENCY:1}
  global-concurrency: ${GLOBAL_DELIVERY_CONCURRENCY:1}
  endpoint-concurrency: ${ENDPOINT_DELIVERY_CONCURRENCY:1}
  permit-lease: ${DISTRIBUTED_PERMIT_LEASE:30s}
  permit-renewal: ${DISTRIBUTED_PERMIT_RENEWAL:10s}
  capacity-deferral: ${CAPACITY_DEFERRAL:20s}
  shutdown-grace: ${DELIVERY_SHUTDOWN_GRACE:5s}
  http-request-timeout: ${HTTP_REQUEST_TIMEOUT:5s}
